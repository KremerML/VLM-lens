[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-lens-sae"
version = "0.1.0"
description = "Utilities and runners for VLM Lens (sae package)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Name" }]

# If you keep a requirements.txt, you can have setuptools read it:
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
include-package-data = true

# Discover all Python packages under the repo root that start with `sae`
[tool.setuptools.packages.find]
where = ["."]
include = ["sae*"]
